<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1f1d"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Outer Card Shell -->
  <rect x="4" y="4" width="912" height="252" rx="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="4" y="4" width="912" height="252" rx="22" fill="url(#grid)"/>

  <!-- Animated Ambient Glows -->
  <circle cx="180" cy="60" r="220" fill="url(#glow1)">
    <animate attributeName="cx" values="180;280;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="200" r="220" fill="url(#glow2)">
    <animate attributeName="cx" values="760;640;760" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner Glass Card (Gitskins Style) -->
  <rect x="22" y="22" width="876" height="216" rx="16" fill="#111827" fill-opacity="0.65" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Decorative Top Arc -->
  <path d="M 215 55 Q 320 25 435 65" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- LEFT: Avatar Box with Animated Orbit Ring -->
  <g transform="translate(115, 130)">
    <!-- Rotating Dashed Ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="10 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="53" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    
    <!-- GitHub Identicon / Geometric Avatar -->
    <rect x="-24" y="-22" width="48" height="12" rx="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-24" y="8" width="16" height="16" rx="3" fill="#a855f7"/>
    <rect x="8" y="8" width="16" height="16" rx="3" fill="#a855f7"/>

    <!-- Online Status Pulse Dot -->
    <circle cx="38" cy="38" r="9" fill="#0f172a"/>
    <circle cx="38" cy="38" r="6" fill="#10b981">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CENTER: Identity & Pill Tags -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Handle -->
    <text x="210" y="68" fill="#10b981" font-size="13" font-weight="600" letter-spacing="2.5" font-family="monospace">@HOANGPHUCLAB</text>
    
    <!-- Main Name -->
    <text x="208" y="114" fill="#f8fafc" font-size="38" font-weight="800" letter-spacing="-0.5">Nguyen Hoang Phuc</text>
    
    <!-- Subtitle -->
    <text x="210" y="144" fill="#94a3b8" font-size="15.5" font-weight="400">Computer Science at CTUET  |  Algorithms &amp; Applied AI/ML</text>

    <!-- Skill Pills (Clean Gitskins Aesthetic) -->
    <g transform="translate(210, 166)" font-size="12.5" font-weight="600" fill="#e2e8f0">
      <rect x="0" y="0" width="84" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="42" y="19" text-anchor="middle">Python</text>

      <rect x="94" y="0" width="96" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="142" y="19" text-anchor="middle">PyTorch</text>

      <rect x="200" y="0" width="136" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="268" y="19" text-anchor="middle">Computer Vision</text>

      <rect x="346" y="0" width="76" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="384" y="19" text-anchor="middle">NLP</text>

      <rect x="432" y="0" width="86" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="475" y="19" text-anchor="middle">ONNX</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="740" y1="50" x2="740" y2="210" stroke="#1e293b" stroke-width="1.5"/>

  <!-- RIGHT: Dynamic Metric & Animated Wave Indicator -->
  <g transform="translate(818, 108)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- Animated Tech Bars -->
    <g transform="translate(-26, -38)">
      <rect x="0" y="10" width="6" height="22" rx="3" fill="#10b981">
        <animate attributeName="height" values="10;26;10" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;6;22" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="11" y="4" width="6" height="28" rx="3" fill="#34d399">
        <animate attributeName="height" values="28;12;28" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;20;4" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="22" y="12" width="6" height="20" rx="3" fill="#059669">
        <animate attributeName="height" values="14;28;14" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;4;18" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="33" y="6" width="6" height="26" rx="3" fill="#38bdf8">
        <animate attributeName="height" values="26;10;26" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;22;6" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="44" y="14" width="6" height="18" rx="3" fill="#10b981">
        <animate attributeName="height" values="12;24;12" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;8;20" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="0" y="20" fill="#10b981" font-size="26" font-weight="800" letter-spacing="1">AI / ML</text>
    <text x="0" y="42" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2.5">CORE FOCUS</text>
    <text x="0" y="78" fill="#475569" font-size="10" font-family="monospace">CTUET • VN</text>
  </g>
</svg>
